<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Virtual Survey — Shaistanaya City</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="vendor/pannellum.css" />
<link rel="stylesheet" href="survey.css" />
<link rel="stylesheet" href="home.css" />
<link rel="stylesheet" href="lead.css" />
</head>
<body>
  <div class="stage">
    <div id="pano"></div>
    <div class="shade" aria-hidden="true"></div>

    <header class="top">
      <button class="brand" id="brand" type="button" aria-label="Kembali ke beranda"><span aria-hidden="true">‹</span> Shaistanaya City</button>
      <nav class="types" id="types" aria-label="Pilih tipe rumah"></nav>
      <button class="pill" id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel">Denah</button>
    </header>

    <h1 class="hero" id="scene-title" aria-live="polite"></h1>

    <footer class="bottom">
      <div class="counter"><b id="count-cur">01</b><span id="count-all">/01</span></div>
      <nav class="floornav" id="floors-nav" aria-label="Pilih lantai"></nav>
    </footer>

    <nav class="rail" id="rail" aria-label="Daftar ruangan"></nav>
    <p class="hint" id="hint" aria-hidden="true"></p>
    <div class="dock" id="dock" role="group" aria-label="Kontrol tur">
      <button id="dock-prev" type="button" aria-label="Ruangan sebelumnya">←</button>
      <button id="dock-play" class="dock__play" type="button" aria-pressed="false" aria-label="Putar tur otomatis"><span class="dock__ico">▶</span><span class="dock__lbl">Tur Otomatis</span></button>
      <button id="dock-next" type="button" aria-label="Ruangan berikutnya">→</button>
      <button id="dock-full" class="dock__full" type="button" aria-label="Layar penuh">⛶</button>
    </div>

    <aside class="panel" id="panel" aria-hidden="true">
      <button class="panel__close" id="panel-close" type="button" aria-label="Tutup">×</button>
      <p class="eyebrow" id="unit-name"></p>
      <div class="floors" id="floors" role="tablist" aria-label="Pilih lantai"></div>
      <div class="plan" id="plan">
        <img id="plan-img" alt="Denah lantai" />
        <div id="plan-dots"></div>
      </div>
      <div class="info">
        <h2 id="floor-name"></h2>
        <dl class="specs" id="specs"></dl>
        <h3>Ringkasan Unit</h3>
        <dl class="specs specs--summary" id="summary"></dl>
        <details class="more" id="building-box">
          <summary>Spesifikasi Bangunan</summary>
          <dl class="specs" id="building"></dl>
        </details>
        <h3>Ruangan</h3>
        <div class="rooms" id="rooms"></div>
      </div>
    </aside>

    <section class="home" id="home" aria-label="Beranda"></section>
  </div>

  <script src="vendor/pannellum.js"></script>
  <script src="data.js"></script>
  <script src="survey.js"></script>
  <script src="home.js"></script>
  <script src="lead.js"></script>
</body>
</html>
