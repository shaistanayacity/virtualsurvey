<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Peta Udara (uji) — Shaistanaya City</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<style>
:root{--page:#e9e8e5;--ink:#0d0d0d;--soft:rgba(255,255,255,.74);--line:rgba(255,255,255,.18);--gold:#e8c98a;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:#fff;font-family:var(--font);padding:24px;-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:relative;height:100%;border-radius:22px;overflow:hidden;background:#1b211c;box-shadow:0 30px 60px -20px rgba(0,0,0,.35),0 8px 20px -8px rgba(0,0,0,.25);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.layer svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.est-poly{fill:rgba(232,201,138,.28);stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px rgba(232,201,138,.95));animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{fill:rgba(232,201,138,.5)}}
.shade{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(130% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.38)),linear-gradient(180deg,rgba(0,0,0,.35),transparent 20%,transparent 72%,rgba(0,0,0,.45))}

/* pin */
.pin{position:absolute;z-index:3;width:30px;height:30px;margin:0;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%) scale(calc(1 / var(--s,1)));color:#fff;font:inherit}
.pin i{position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.14);backdrop-filter:blur(2px);box-shadow:0 0 0 0 rgba(255,255,255,.55);animation:ring 2.4s infinite}
.pin[data-c=rs] i{border-color:#ff8f86}.pin[data-c=wisata] i{border-color:#c9a3ff}.pin[data-c=umum] i{border-color:#8fe0a0}.pin[data-c=edu] i{border-color:#8cc4ff}.pin[data-c=kota] i{border-color:#ffd98a}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.pin:hover i,.pin.on i{background:rgba(255,255,255,.4)}
.pin.on{z-index:5}
.pin .chip{position:absolute;left:34px;top:50%;transform:translateY(-50%) translateX(-4px);white-space:nowrap;padding:6px 12px;border-radius:999px;background:rgba(13,13,13,.88);font:500 12px var(--font);letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.pin:hover .chip,.pin.on .chip{opacity:1;transform:translateY(-50%)}
.pin.home{width:44px;height:44px;z-index:4}
.pin.home i{inset:6px;border:2.5px solid var(--gold);background:rgba(232,201,138,.35);animation:ringg 2s infinite}
@keyframes ringg{0%{box-shadow:0 0 0 0 rgba(232,201,138,.8)}100%{box-shadow:0 0 0 22px rgba(232,201,138,0)}}
.pin.home .chip{opacity:1;transform:translateY(-50%);left:48px;background:linear-gradient(135deg,#f3dba6,#c9a25b);color:#1b1608;font-weight:700}

/* UI */
.top{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:24px 30px;pointer-events:none}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-weight:600;font-size:15px}.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.badge{padding:8px 16px;border-radius:999px;background:rgba(255,196,64,.94);color:#2b1d00;font:700 11px var(--font);letter-spacing:.1em;text-transform:uppercase}
.btn{white-space:nowrap;pointer-events:auto;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:500 12px var(--font);letter-spacing:.04em;cursor:pointer}
.btn:hover{background:#000}
.hint{position:absolute;z-index:6;left:50%;top:74px;transform:translate(-50%,-6px);margin:0;padding:8px 16px;border-radius:999px;background:rgba(13,13,13,.66);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.03em;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;text-align:center;max-width:88%}
.hint.show{opacity:1;transform:translate(-50%,0)}
.dock{position:absolute;z-index:6;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:rgba(0,0,0,.34);backdrop-filter:blur(14px);border:1px solid var(--line)}
.dock button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:38px;height:38px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#fff;font:500 12px var(--font);letter-spacing:.03em;cursor:pointer}
.dock button:hover{background:rgba(255,255,255,.18)}
.dock .play{background:#fff;color:var(--ink);padding:0 16px}.dock .play:hover{background:#f0efec}
.credit{position:absolute;z-index:6;right:20px;bottom:14px;margin:0;font-size:10.5px;letter-spacing:.04em;color:rgba(255,255,255,.62);text-align:right;pointer-events:none}
.card{position:absolute;z-index:7;left:28px;bottom:92px;width:min(330px,calc(100% - 56px));padding:20px 22px 18px;border-radius:18px;background:rgba(20,23,21,.72);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);box-shadow:0 24px 50px -20px rgba(0,0,0,.6);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.card.open{opacity:1;transform:none;pointer-events:auto}
.card small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.card h2{margin:0 0 12px;font-weight:500;font-size:21px;letter-spacing:-.01em;line-height:1.2}
.card .row{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.card .row b{font-weight:600;font-size:22px;letter-spacing:-.02em}
.card .row span{color:var(--soft);font-weight:300}
.card .x{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--soft);font-size:22px;cursor:pointer}
.card .note{margin:6px 0 0;font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.5)}
.list{position:absolute;z-index:6;right:24px;top:78px;bottom:90px;width:240px;overflow:auto;padding:14px 12px;border-radius:16px;background:rgba(20,23,21,.5);backdrop-filter:blur(16px);border:1px solid var(--line)}
.list h3{margin:2px 8px 10px;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.list button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:#fff;font:400 12.5px var(--font);text-align:left;cursor:pointer}
.list button:hover,.list button.on{background:rgba(255,255,255,.14)}
.list button em{font-style:normal;color:var(--soft);font-size:11px;white-space:nowrap}
.list .soon{margin:10px 8px 4px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;line-height:1.55;color:rgba(255,255,255,.55)}
@media (max-width:820px){
 body{padding:10px}.stage{border-radius:18px}
 .top{padding:14px 14px;gap:8px}.brand b{font-size:13px}.brand span{font-size:9.5px}.badge{padding:6px 11px;font-size:10px}.btn{padding:9px 13px;font-size:11px}.list{display:none}
 .card{left:12px;right:12px;width:auto;bottom:84px}
 .dock{bottom:16px}.credit{display:none}.hint{top:80px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.pin i,.est-poly,.pin.home i{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Peta udara kawasan">
  <div class="layer" id="layer" style="width:1908px;height:624px">
    <img id="img" alt="Foto udara Sidoarjo dengan kawasan Shaistanaya City" width="1908" height="624" src="photos/peta-udara.webp" />
    <svg viewBox="0 0 1908 624" aria-hidden="true"><polygon class="est-poly" points="1024,341 1039,337 1056,363 1041,365" /></svg>
  </div>
  <div class="shade" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><b>Shaistanaya City</b><span>Peta Udara</span></div>
    <span class="badge">Simulasi</span>
    <button class="btn" id="reset" type="button">Tampilan awal</button>
  </header>
  <p class="hint" id="hint">Geser untuk menjelajah · scroll atau cubit untuk zoom · ketuk pin untuk detail</p>
  <aside class="list" id="list" aria-label="Daftar tempat"></aside>
  <section class="card" id="card" aria-live="polite">
    <button class="x" id="cardx" type="button" aria-label="Tutup">×</button>
    <small id="c-cat"></small><h2 id="c-name"></h2>
    <div class="row"><b id="c-min"></b><span>menit dari kawasan</span></div>
    <p class="note">Simulasi: waktu tempuh hanya contoh dan belum diverifikasi.</p>
  </section>
  <div class="dock" role="group" aria-label="Kontrol peta">
    <button id="prev" type="button" aria-label="Tempat sebelumnya">←</button>
    <button id="play" class="play" type="button" aria-pressed="false"><span id="playi">▶</span><span id="playl">Tur Otomatis</span></button>
    <button id="next" type="button" aria-label="Tempat berikutnya">→</button>
    <button id="zin" type="button" aria-label="Perbesar">+</button>
    <button id="zout" type="button" aria-label="Perkecil">−</button>
  </div>
  <p class="credit">Citra: Google Earth · Simulasi, bukan peta berskala</p>
</div>
<script>
(function () {
  "use strict";
  var IW = 1908, IH = 624;
  var HOME = { id: "home", name: "Shaistanaya City", cat: "Kawasan", x: 1040, y: 352, min: 0 };
  // Tempat berlabel di gambar. min = waktu tempuh CONTOH (belum diverifikasi).
  var POI = [
    { id: "gelora",    name: "Gelora Delta Stadium",          cat: "Stadion",    c: "umum",   x: 1118, y: 198, min: 6 },
    { id: "sidoarjo",  name: "Pusat Kota Sidoarjo",           cat: "Pusat kota", c: "kota",   x: 1100, y: 236, min: 5 },
    { id: "notopuro",  name: "RSUD RT Notopuro Sidoarjo",     cat: "Rumah sakit",c: "rs",     x: 1338, y: 242, min: 10 },
    { id: "pusura",    name: "RS Pusura Candi",               cat: "Rumah sakit",c: "rs",     x: 1513, y: 364, min: 14 },
    { id: "umsida",    name: "Universitas Muhammadiyah Sidoarjo Kampus 3", cat: "Pendidikan", c: "edu", x: 721, y: 331, min: 7 },
    { id: "suryamas",  name: "Perum Citra Surya Mas",         cat: "Perumahan",  c: "kota",   x: 870,  y: 147, min: 7 },
    { id: "assakinah", name: "RS Assakinah Medika",           cat: "Rumah sakit",c: "rs",     x: 659,  y: 156, min: 13 },
    { id: "rahman",    name: "RS Rahman Rahim",               cat: "Rumah sakit",c: "rs",     x: 664,  y: 187, min: 13 },
    { id: "arafah",    name: "Arafah Anwar Medika Hospital",  cat: "Rumah sakit",c: "rs",     x: 569,  y: 94,  min: 15 },
    { id: "ktg",       name: "KTG Jungle Water Park",         cat: "Wisata",     c: "wisata", x: 1371, y: 583, min: 18 },
    { id: "harmoni",   name: "Citra Harmoni Water Park",      cat: "Wisata",     c: "wisata", x: 245,  y: 101, min: 20 }
  ];
  var ALL = [HOME].concat(POI);

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), layer = $("layer"), cardEl = $("card"), hint = $("hint");
  var W = 0, H = 0, s = 1, tx = 0, ty = 0, anim = 0, cur = -1, touring = false, tourT = 0;

  function cover() { return Math.max(W / IW, H / IH); }
  function clamp() {
    var mn = cover(), mx = mn * 4;
    s = Math.min(mx, Math.max(mn, s));
    tx = Math.min(0, Math.max(W - IW * s, tx));
    ty = Math.min(0, Math.max(H - IH * s, ty));
  }
  function apply() {
    clamp();
    layer.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
    layer.style.setProperty("--s", s);
  }
  function measure() { var r = stage.getBoundingClientRect(); W = r.width; H = r.height; }

  // Pin
  var pins = {};
  function el(t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  ALL.forEach(function (p, i) {
    var b = el("button", "pin" + (p.id === "home" ? " home" : "")); b.type = "button";
    if (p.c) b.setAttribute("data-c", p.c);
    b.style.left = p.x + "px"; b.style.top = p.y + "px";
    b.setAttribute("aria-label", p.name);
    b.appendChild(el("i")); b.appendChild(el("span", "chip", p.name));
    b.addEventListener("click", function (e) { e.stopPropagation(); stopTour(); select(i, true); });
    b.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    layer.appendChild(b); pins[p.id] = b;
  });

  // Daftar
  var list = $("list"); list.appendChild(el("h3", null, "Tempat sekitar"));
  ALL.forEach(function (p, i) {
    var b = el("button"); b.type = "button"; b.setAttribute("data-i", i);
    b.appendChild(el("span", null, p.name)); b.appendChild(el("em", null, p.id === "home" ? "pusat" : "±" + p.min + " mnt"));
    b.addEventListener("click", function () { stopTour(); select(i, true); });
    list.appendChild(b);
  });
  list.appendChild(el("p", "soon", "Belum ada di gambar: Lippo Plaza, Stasiun Sidoarjo, Puskesmas Sidodadi. Tambahkan pin di Google Earth lalu kirim gambar barunya."));

  // Animasi kamera
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function flyTo(px, py, ns, dur) {
    cancelAnimationFrame(anim);
    var s0 = s, x0 = tx, y0 = ty, mn = cover();
    ns = Math.max(mn, Math.min(mn * 4, ns));
    var fy = H * (W < 820 ? .36 : .46);
    var tx1 = W / 2 - px * ns, ty1 = fy - py * ns;
    var t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / (dur || 1200)), e = ease(k);
      // zoom log-interpolated supaya terasa halus
      s = Math.exp(Math.log(s0) + (Math.log(ns) - Math.log(s0)) * e);
      tx = x0 + (tx1 - x0) * e; ty = y0 + (ty1 - y0) * e; apply();
      if (k < 1) anim = requestAnimationFrame(step);
    })(t0);
  }
  function select(i, fly) {
    cur = i; var p = ALL[i];
    Object.keys(pins).forEach(function (k) { pins[k].classList.toggle("on", k === p.id); });
    Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { b.classList.toggle("on", +b.getAttribute("data-i") === i); });
    $("c-cat").textContent = p.cat; $("c-name").textContent = p.name;
    $("c-min").textContent = p.id === "home" ? "—" : "±" + p.min;
    cardEl.querySelector(".row").style.display = p.id === "home" ? "none" : "";
    cardEl.classList.add("open");
    if (fly) flyTo(p.x, p.y, cover() * (p.id === "home" ? 2.1 : 1.9), 1400);
  }
  function closeCard() { cardEl.classList.remove("open"); cur = -1; Object.keys(pins).forEach(function (k) { pins[k].classList.remove("on"); }); Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { b.classList.remove("on"); }); }
  $("cardx").addEventListener("click", closeCard);
  function step(d) { stopTour(); select(((cur < 0 ? 0 : cur) + d + ALL.length) % ALL.length, true); }
  $("prev").addEventListener("click", function () { step(-1); });
  $("next").addEventListener("click", function () { step(1); });
  function home() { closeCard(); var mn = cover(); flyTo(HOME.x, HOME.y, mn * 1.15, 1600); }
  $("reset").addEventListener("click", function () { stopTour(); home(); });

  // Tur
  function tick() { if (!touring) return; select(((cur < 0 ? -1 : cur) + 1) % ALL.length, true); tourT = setTimeout(tick, 5200); }
  function setTour(on) { touring = on; $("play").setAttribute("aria-pressed", on); $("playi").textContent = on ? "❚❚" : "▶"; $("playl").textContent = on ? "Jeda" : "Tur Otomatis"; }
  function stopTour() { clearTimeout(tourT); if (touring) setTour(false); }
  $("play").addEventListener("click", function () { if (touring) { stopTour(); return; } setTour(true); hint.classList.remove("show"); clearTimeout(tourT); cur = -1; tick(); });

  // Geser / zoom (mouse + sentuh + cubit)
  var ptrs = {}, last = null;
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function zoomAt(cx, cy, ns) {
    var mn = cover(); ns = Math.max(mn, Math.min(mn * 4, ns));
    var k = ns / s; tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k; s = ns; apply();
  }
  stage.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".dock,.card,.list,.top,.btn")) return;
    stopTour(); cancelAnimationFrame(anim); hint.classList.remove("show");
    stage.setPointerCapture(e.pointerId); ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; stage.classList.add("drag");
    last = null;
  });
  stage.addEventListener("pointermove", function (e) {
    if (!ptrs[e.pointerId]) return;
    var r = stage.getBoundingClientRect(), ids = Object.keys(ptrs), old = { x: ptrs[e.pointerId].x, y: ptrs[e.pointerId].y };
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ids.length === 1) { tx += e.clientX - old.x; ty += e.clientY - old.y; apply(); }
    else if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = dist(a, b), m = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
      if (last) { zoomAt(m.x, m.y, s * d / last.d); tx += m.x - last.m.x; ty += m.y - last.m.y; apply(); }
      last = { d: d, m: m };
    }
  });
  function up(e) { delete ptrs[e.pointerId]; last = null; if (!Object.keys(ptrs).length) stage.classList.remove("drag"); }
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", function (e) {
    e.preventDefault(); stopTour(); cancelAnimationFrame(anim);
    var r = stage.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, s * Math.exp(-e.deltaY * 0.0016));
  }, { passive: false });
  stage.addEventListener("dblclick", function (e) { if (e.target.closest(".pin,.dock,.card,.list,.top")) return; var r = stage.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, s * 1.6); });
  $("zin").addEventListener("click", function () { stopTour(); zoomAt(W / 2, H / 2, s * 1.4); });
  $("zout").addEventListener("click", function () { stopTour(); zoomAt(W / 2, H / 2, s / 1.4); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowDown") step(1);
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") step(-1);
    else if (e.key === "Escape") closeCard();
    else if (e.key === " ") { e.preventDefault(); $("play").click(); }
  });
  window.addEventListener("resize", function () { measure(); apply(); });

  // Awal: terbang dari dekat kawasan lalu menjauh
  measure(); var mn0 = cover(); s = mn0 * 2.8; tx = W / 2 - HOME.x * s; ty = H * .46 - HOME.y * s; apply();
  setTimeout(function () { flyTo(HOME.x, HOME.y, cover() * 1.15, 4200); }, 400);
  setTimeout(function () { select(0, false); }, 3200);
  setTimeout(function () { hint.classList.add("show"); }, 4800);
  setTimeout(function () { hint.classList.remove("show"); }, 11000);
  window.__sim = { get: function () { return { s: s, tx: tx, ty: ty, W: W, H: H, cover: cover(), cur: cur }; } };
})();
</script>
</body>
</html>
